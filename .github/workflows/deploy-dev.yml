name: Deploy Dev

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
deploy-dev:
  runs-on: ubuntu-latest
  needs: build
  environment: dev

  steps:
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure (DEV)
      run: |
        az webapp config container set \
          --name ${{ secrets.AZURE_DEV_APP_NAME }} \
          --resource-group ${{ secrets.AZURE_DEV_RG }} \
          --docker-custom-image-name ${{ secrets.ACR_LOGIN_SERVER }}/$IMAGE_NAME:${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build deployment package
        run: |
          tar -czf mcp-app.tar.gz app requirements.txt startup.sh

      - name: Deploy to Dev
        run: |
          echo "Deploying mcp-app.tar.gz to dev environment"
          # az webapp deploy ...
