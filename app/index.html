<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>CDYP7 – MCP Data Import Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            margin: 0;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: #0f172a;
            color: #fff;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 600;
        }

        main {
            max-width: 900px;
            margin: 32px auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            padding: 24px 32px;
        }

        fieldset {
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 20px;
        }

        legend {
            font-weight: 600;
            padding: 0 6px;
        }

        label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
        }

        input[type="file"] {
            margin-top: 8px;
        }

        .actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
        }

        button {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            background: #2563eb;
            color: white;
        }

        button.secondary {
            background: #6b7280;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 24px;
            padding: 16px;
            border-radius: 6px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
        }

        .status.valid {
            border-left: 6px solid #16a34a;
        }

        .status.invalid {
            border-left: 6px solid #dc2626;
        }

        ul {
            margin: 8px 0 0 20px;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <header>
        CDYP7 – MCP Data Import Dashboard
    </header>

    <main>
        <fieldset>
            <legend>Dataset Type</legend>
            <label>
                <input type="radio" name="dataset" value="MCP_FEATURES" checked />
                MCP_Features
            </label>
            <label>
                <input type="radio" name="dataset" value="FEATURE_REQUIREMENT_TRACE" />
                Feature–Requirement Trace
            </label>
            <label>
                <input type="radio" name="dataset" value="FEATURE_REQUIREMENT_VERIFICATION_GRAPH" />
                Feature–Requirement–Verification Graph
            </label>
        </fieldset>

        <fieldset>
            <legend>Upload File</legend>
            <input id="fileInput" type="file" accept=".csv,.json" />
        </fieldset>

        <div class="actions">
            <button id="validateBtn" class="secondary">Validate</button>
            <button id="importBtn" disabled>Import</button>
        </div>

        <div id="status" class="status" style="display:none;"></div>
    </main>

    <footer>
        Deterministic MCP Import • Dataverse → Azure AI Search → MCP Server
    </footer>

    <script>
        const validateBtn = document.getElementById("validateBtn");
        const importBtn = document.getElementById("importBtn");
        const statusDiv = document.getElementById("status");
        const fileInput = document.getElementById("fileInput");

        function getDataset() {
            return document.querySelector('input[name="dataset"]:checked').value;
        }

        function showStatus(html, valid) {
            statusDiv.innerHTML = html;
            statusDiv.className = "status " + (valid ? "valid" : "invalid");
            statusDiv.style.display = "block";
        }

        validateBtn.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) {
                alert("Please select a file.");
                return;
            }

            const form = new FormData();
            form.append("dataset", getDataset());
            form.append("file", file);

            showStatus("Validating…", true);
            importBtn.disabled = true;

            const res = await fetch("/api/mcp/validate-import", {
                method: "POST",
                body: form
            });

            const result = await res.json();

            if (result.valid) {
                showStatus(
                    `<strong>Validation passed</strong>
           <div>Warnings: ${result.warnings?.length || 0}</div>`,
                    true
                );
                importBtn.disabled = false;
            } else {
                let errors = "<ul>";
                (result.errors || []).forEach(e => errors += `<li>${e}</li>`);
                errors += "</ul>";

                showStatus(
                    `<strong>Validation failed</strong>${errors}`,
                    false
                );
            }
        };

        importBtn.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) return;

            const form = new FormData();
            form.append("dataset", getDataset());
            form.append("file", file);

            showStatus("Importing to Dataverse…", true);
            importBtn.disabled = true;

            const res = await fetch("/api/dataverse/batch-import", {
                method: "POST",
                body: form
            });

            if (res.ok) {
                showStatus("<strong>Import completed successfully</strong>", true);
            } else {
                showStatus("<strong>Import failed</strong>", false);
            }
        };
    </script>
</body>

</html>
