name: Deploy Dev

on:
  workflow_run:
    workflows: ["Python application"]
    types:
      - completed

jobs:
  deploy-dev:
    name: Deploy Dev (Immutable)
    runs-on: ubuntu-latest
    environment: dev

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mcp-harness-api

    steps:
      - name: Azure Login
        uses: azure/login@v2

      # ✅ Deploy immutable image
      - name: Deploy to Dev WebApp
        run: |
          az webapp config container set \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --docker-custom-image-name "$IMAGE_NAME:${{ steps.vars.outputs.SHA }}"
        env:
          WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

      # ✅ Health check (prevents silent bad deploy)
      - name: Verify deployment
        run: |
          sleep 15
          curl -f https://$WEBAPP_NAME.azurewebsites.net/health
        env:
          WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
