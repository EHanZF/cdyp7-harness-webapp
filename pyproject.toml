[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-intent-boundary"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "python-docx",
  "fastmcp>=3.3.1",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pylint",
  "jsonschema",
  "httpx",
  "pydantic",
  "debugpy"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--import-mode=importlib"]

[tool.pylint.main]
py-version = "3.12"
recursive = true

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "too-few-public-methods"
]

[tool.coverage.run]
source = ["app"]
omit = [
  ".venv/*",
  "*/site-packages/*",
  "tests/*",
  "__pycache__/*"
]

[tool.setuptools.packages.find]
where = ["app"]
