trigger: none
pr: none

resources:
  webhooks:
    - webhook: GitHubReleaseHook
      connection: GitHub-To-Azure-Incoming-Connection

variables:
  pythonVersion: '3.12'
  artifactName: 'drop'
  packageName: 'app.zip'
  packagePath: '$(Build.ArtifactStagingDirectory)/app.zip'
  enableDeploy: 'false'

pool:
  vmImage: 'ubuntu-latest'

stages:

# ======================
# STAGE 1: VALIDATE
# ======================
- stage: Validate_And_Package
  displayName: 'Validate and Build Package'
  jobs:
  - job: validate
    displayName: 'Contract + Runtime Validation'
    steps:

    - checkout: self
      clean: true

    - task: UsePythonVersion@0
      displayName: 'Use Python $(pythonVersion)'
      inputs:
        versionSpec: '$(pythonVersion)'
        architecture: 'x64'

    - bash: |
        set -euo pipefail

        echo "Python version:"
        python --version

        python -m venv .venv
        source .venv/bin/activate

        python -m pip install --upgrade pip setuptools wheel

        echo "Installing dependencies..."

        # 🔒 Fail-fast if dependencies break on Python 3.13
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

        if [ -f requirements-dev.txt ]; then
          pip install -r requirements-dev.txt
        fi

        echo "Installed packages:"
        pip list

        echo "Running static validation..."
        python scripts/validate_static.py

        echo "Running contract tests..."
        python -m pytest tests/contract/test_tooling_api_contract.py -q
      displayName: 'Validate runtime boundaries and contracts'

    - bash: |
        set -euo pipefail

        mkdir -p $(Build.ArtifactStagingDirectory)

        zip -r $(packagePath) . \
          -x '.venv/*' \
          -x '.git/*' \
          -x 'outputs/*' \
          -x 'artifacts/*' \
          -x 'receipts/*' \
          -x '__pycache__/*' \
          -x '*.pyc'

        ls -lah $(Build.ArtifactStagingDirectory)
      displayName: 'Package application'

    - publish: $(packagePath)
      artifact: $(artifactName)


# ======================
# STAGE 2: SMOKE
# ======================
- stage: DevSmoke
  displayName: 'Smoke Validation'
  dependsOn: Validate_And_Package
  condition: succeeded()

  jobs:
  - job: smoke
    displayName: 'Smoke Test Runtime'
    steps:

    - checkout: self
      clean: true

    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(pythonVersion)

    - bash: |
        set -euo pipefail

        python -m venv .venv
        source .venv/bin/activate

        pip install --upgrade pip

        [ -f requirements.txt ] && pip install -r requirements.txt
        [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt

        echo "Running smoke validation..."
        python scripts/smoke_tooling.py
      displayName: 'Run smoke tooling'


# ======================
# STAGE 3: DEPLOY (GATED)
# ======================
- stage: Deploy
  displayName: 'Production Delivery'
  dependsOn: DevSmoke
  condition: and(succeeded(), eq(variables['enableDeploy'], 'true'))

  jobs:
  - job: deploy
    displayName: 'Transmit Package'
    steps:

    - download: current
      artifact: $(artifactName)

    - bash: |
        set -euo pipefail

        FILE="$(Pipeline.Workspace)/$(artifactName)/$(packageName)"

        test -f "$FILE"

        echo "Deploying package..."

        curl --fail --show-error \
          -H "Authorization: Bearer ${SECURE_TOKEN}" \
          -F "file=@${FILE}" \
          -F "version=$(Build.BuildNumber)" \
          "${CLIENT_DEPLOY_URL}"
      env:
        SECURE_TOKEN: $(WEBHOOK_SECRET)
        CLIENT_DEPLOY_URL: $(CLIENT_DEPLOY_URL)python -m pytest tests/contract/test_tooling_api_contract.py
