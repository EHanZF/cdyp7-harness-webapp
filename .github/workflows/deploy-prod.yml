name: Deploy Prod (Immutable Promotion)

on:
  workflow_run:
    workflows: ["Deploy Dev (Immutable)"]
    types:
      - completed

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mcp-harness-api

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    # ✅ REQUIRED for production safety (manual approval)
    environment: prod

    steps:
      - name: Extract commit SHA from Dev deploy
        id: vars
        run: |
          echo "SHA=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT

      - name: Debug production deployment target
        run: |
          echo "Promoting commit SHA: ${{ steps.vars.outputs.SHA }}"
          echo "Using image: $IMAGE_NAME:${{ steps.vars.outputs.SHA }}"

      # ✅ Azure login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ✅ Deploy EXACT same image (immutable promotion)
      - name: Deploy container to Azure WebApp (PROD)
        run: |
          az webapp config container set \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --docker-custom-image-name "$IMAGE_NAME:${{ steps.vars.outputs.SHA }}"
        env:
          WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP_PROD }}

      # ✅ Health check (fail fast if bad)
      - name: Verify production deployment
        run: |
          sleep 15
          curl -f https://$WEBAPP_NAME.azurewebsites.net/health
        env:
          WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
