name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: PYTHONPATH=. pytest -c pytest.ini --ignore=tests/contract

      - name: Enforce version pinning
        run: ts-node scripts/checkVersions.ts

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  build-artifact:
    runs-on: ubuntu-latest
    needs: [python-checks, lint]

    steps:
      - uses: actions/checkout@v5

      - name: Build deployment artifact
        run: |
          tar -czf mcp-app.tar.gz app requirements.txt startup.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-package
          path: mcp-app.tar.gz

  playwright-e2e:
    runs-on: ubuntu-latest
    needs: [build-artifact]

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify Python app import
        run: python -c "import app; import app.main"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npx playwright test

  deploy-dev:
    runs-on: ubuntu-latest
    needs: [playwright-e2e]

    environment: dev

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: mcp-package

      - name: Deploy to Dev
        run: |
          echo "Deploying mcp-app.tar.gz to dev environment"
          # replace with real deploy logic:
          # az webapp deploy ...
