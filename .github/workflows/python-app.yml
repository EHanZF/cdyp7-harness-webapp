name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Standardize project-wide paths at the global job level
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      # Upgraded to v6 for native Node 24 support
      - uses: actions/checkout@v6

      # Configured with Python 3.13 and integrated dependency caching
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run repository guards
        if: github.event_name == 'pull_request'
        run: |
          set -e
          python .github/hooks/static_namespace_guard.py --root .
          python .github/hooks/forbidden_reference_guard.py --root .
          if [ -f contracts/cdyp7-tool-allowlist.yaml ]; then
            python .github/hooks/tool_allowlist_guard.py --root .
          else
            echo "Skipping tool_allowlist_guard (contracts missing)"
          fi
          python .github/hooks/policy_override_guard.py --root .
          python .github/hooks/schema_snapshot_guard.py --root .
          python .github/hooks/tool_result_envelope_guard.py --root .

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          pytest -vv
