repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: playwright-tests
        name: Run Playwright tests
        entry: npx playwright test --reporter=line
        language: system
        pass_filenames: false
