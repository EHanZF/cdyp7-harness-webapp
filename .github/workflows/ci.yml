name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # ✅ Job 1: Python checks (fast)
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: pytest

  # ✅ Job 2: Pre-commit / linting (fast, parallel)
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files
  # ✅ Build artifact (runs in parallel with lint)
  build-artifact:
    runs-on: ubuntu-latest
    needs: [python-checks, lint]

    steps:
      - uses: actions/checkout@v5

      - name: Package app
        run: |
          tar -czf mcp-app.tar.gz app requirements.txt startup.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-package
          path: mcp-app.tar.gz

  # ✅ Job 3: Playwright E2E (slowest, runs separately)
  playwright-e2e:
    runs-on: ubuntu-latest
    needs: [python-checks]  # ensures backend is valid before running browser tests

    steps:
      - uses: actions/checkout@v5

      # ✅ Python setup (for FastAPI server)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ✅ Node setup for Playwright
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      # ✅ Cache Playwright browsers (BIG speed boost)
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install

      # ✅ Run E2E tests
      - name: Run Playwright tests
        working-directory: tests/e2e
        run: npx playwright test

      # ✅ Upload report (optional but useful)
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
