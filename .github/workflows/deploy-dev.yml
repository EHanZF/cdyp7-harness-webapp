name: Deploy Dev

on:
  workflow_run:
    workflows: ["Python application"]
    types:
      - completed

jobs:
  deploy:name: Deploy Dev (Immutable)

on:
  workflow_run:
    workflows: ["Python application"]
    types:
      - completed

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mcp-harness-api

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev

  steps:
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure (DEV)
      run: |
        az webapp config container set \
          --name ${{ secrets.AZURE_DEV_APP_NAME }} \
          --resource-group ${{ secrets.AZURE_DEV_RG }} \
          --docker-custom-image-name ${{ secrets.ACR_LOGIN_SERVER }}/$IMAGE_NAME:${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ Optional: sanity check (prevents deploying broken app)
      - name: Validate app starts
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 5
          curl -f http://127.0.0.1:8000/health || exit 1

      # ✅ Replace this with your real deploy target
      - name: Deploy to Dev
        run: |
          echo "Deploying to DEV environment..."
          # Example:
          # az webapp deploy ...
