name: Software Delivery Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Grants the pipeline permissions to write git tags back to your repository
permissions:
  contents: write

jobs:
  ci-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essential: fetches full git history for correct version calculations

      - name: Determine Semantic Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          branch: main
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: "${major}.${minor}.${patch}"

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Versioned Software Artifact
        run: |
          echo "Packaging application version v${{ steps.semver.outputs.version }}..."
          tar -czf mcp-app-v${{ steps.semver.outputs.version }}.tar.gz app requirements.txt startup.sh || tar -czf mcp-app-v${{ steps.semver.outputs.version }}.tar.gz .

      - name: Publish Artifact for Software Agents
        uses: actions/upload-artifact@v4
        with:
          name: mcp-software-v${{ steps.semver.outputs.version }}
          path: mcp-app-v${{ steps.semver.outputs.version }}.tar.gz
          retention-days: 14

      - name: Push Git Version Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.semver.outputs.version }}
          git push origin v${{ steps.semver.outputs.version }}
