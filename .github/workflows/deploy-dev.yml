name: Deploy Dev (Immutable)

on:
  workflow_run:
    workflows: ["Python application"]
    types:
      - completed

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mcp-harness-api

jobs:
  deploy-dev:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Extract commit SHA
        id: vars
        run: |
          echo "SHA=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT

      - name: Debug deployment
        run: |
          echo "Deploying commit: ${{ steps.vars.outputs.SHA }}"
          echo "Image: $IMAGE_NAME:${{ steps.vars.outputs.SHA }}"

      # ✅ Azure login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ✅ Deploy immutable image
      - name: Deploy to Dev WebApp
        run: |
          az webapp config container set \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --docker-custom-image-name "$IMAGE_NAME:${{ steps.vars.outputs.SHA }}"
        env:
          WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

      # ✅ Health check (prevents silent bad deploy)
      - name: Verify deployment
        run: |
          sleep 15
          curl -f https://$WEBAPP_NAME.azurewebsites.net/health
        env:
          WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
